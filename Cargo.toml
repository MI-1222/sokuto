[workspace]
resolver = "2"
members = [
    "crates/sokuto-core",
    "crates/sokuto-runtime",
    "crates/sokuto-server",
    "crates/sokuto-cli",
]

[workspace.package]
version = "0.3.6"
edition = "2024"

[workspace.dependencies]
sokuto-core = { path = "crates/sokuto-core" }
sokuto-runtime = { path = "crates/sokuto-runtime" }
sokuto-server = { path = "crates/sokuto-server" }
sokuto-cli = { path = "crates/sokuto-cli" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
indexmap = { version = "2.7", features = ["serde"] }
tokenizers = "0.21"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls", "tracing"] }
ndarray = "0.16"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1.43", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit", "cors", "timeout"] }
utoipa = { version = "5.3", features = ["indexmap"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1.11"
num_cpus = "1.16"
mimalloc = { version = "0.1", default-features = false }
crossbeam-queue = "0.3.14"
futures-util = "0.3.34"
aho-corasick = "1.1"
bytes = "1.9"
