[project]
name = "sokuto-train"
version = "0.3.6"
description = "Jev train"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "marimo>=0.24.2",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "pyyaml>=6.0.2",
    "scipy>=1.18.1",
    "matplotlib>=3.10.0",
    "huggingface-hub>=1.32.0",
    "pydantic>=2.0.0",
    "orjson>=3.9.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[tool.pytest.ini_options]
markers = [
    "slow: 実行時間が長いテスト",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["B018"]
